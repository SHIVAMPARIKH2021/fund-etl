[project]
name = "fund-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.5",
    "pydantic-core>=2.46.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
fund-etl = "fund_etl:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pandera>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Ensure the repo root is importable regardless of how pytest is invoked
# (console-script vs `python -m pytest`), so `main` and `tests.*` resolve.
pythonpath = ["."]
addopts = "-q --strict-markers --cov=src/fund_etl --cov=main --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/fund_etl", "main"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# Enforce the >=85% coverage gate required for this pipeline.
fail_under = 85.0
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

