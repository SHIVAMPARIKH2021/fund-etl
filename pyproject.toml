[project]
name = "fund-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "psycopg>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-core>=2.46.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
fund-etl = "fund_etl:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
