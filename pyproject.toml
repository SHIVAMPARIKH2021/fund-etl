[project]
name = "fund-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dataclasses>=0.8",
    "datetime>=6.0",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pandera[polars]>=0.23.0",
    "pika>=1.4.4",
    "polars>=1.44.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.5",
    "pydantic-core>=2.46.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "typing>=3.10.0.0",
    "uuid6>=2025.0.1",
]

[project.scripts]
fund-etl = "fund_etl:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
